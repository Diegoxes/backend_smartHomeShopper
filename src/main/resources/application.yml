spring:
  datasource:
    # Render: estas variables se configuran en el panel (NO aquí en duro)
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Poolers (Supabase 6543, PgBouncer modo transacción): evita server-side prepared statements
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: framework

jwt:
  # En producción usa JWT_SECRET largo (≥32 caracteres ASCII recomendado). Valores cortos se hashean con SHA-256 al vuelo.
  secret: ${JWT_SECRET:smarthome-shopper-dev-only-32chars-min!}
  expiration: 86400000

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  whatsapp-from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

logging:
  level:
    com.smarthome: DEBUG
    org.springframework.security: WARN

# Mantenimiento: al activarlo (o desde panel OWNER), solo usuarios con rol OWNER pueden usar la API.
app:
  maintenance:
    enabled: ${APP_MAINTENANCE_ENABLED:false}

# CORS: el backend acepta cualquier origen (configuración permisiva; restringe en prod si lo necesitas).