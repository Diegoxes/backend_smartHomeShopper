spring:
  datasource:
    # En Render: define SPRING_DATASOURCE_URL, USERNAME y PASSWORD en el panel (sin commitear).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smarthome_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: framework

jwt:
  # Obligatorio en producción (Render: añade JWT_SECRET en Environment). No pongas el valor aquí.
  secret: ${JWT_SECRET:}
  expiration: 86400000

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-3.5-turbo

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  whatsapp-from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

logging:
  level:
    com.smarthome: DEBUG
    org.springframework.security: WARN
