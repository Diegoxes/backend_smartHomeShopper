spring:
  datasource:
    # Render: estas variables se configuran en el panel (NO aquí en duro)
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: framework

jwt:
  # valor por defecto SOLO para evitar crash si no configuras env (pero igual debes ponerlo en Render)
  secret: ${JWT_SECRET:cursoDesarrolloSoftware15}
  expiration: 86400000

openai:
  api-key: ${OPENAI_API_KEY:}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  whatsapp-from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

logging:
  level:
    com.smarthome: DEBUG
    org.springframework.security: WARN

# CORS: el backend acepta cualquier origen (configuración permisiva; restringe en prod si lo necesitas).